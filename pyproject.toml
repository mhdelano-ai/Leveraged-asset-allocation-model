[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetforecast"
version = "0.1.0"
description = "One-year-ahead covariance, expected returns and predictive distributions for a 12-asset universe"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "statsmodels", "scikit-learn", "arch",
  "lightgbm", "hmmlearn", "pyarrow", "requests", "openpyxl", "xlrd", "matplotlib", "threadpoolctl",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["assetforecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet", "slow: takes more than a few seconds", "realdata: needs data/processed"]
