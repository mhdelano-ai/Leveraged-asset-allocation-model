[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volmodel"
version = "0.1.0"
description = "One-year-ahead covariance forecasts for a multi-asset universe"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "statsmodels", "scikit-learn", "arch",
  "lightgbm", "hmmlearn", "pyarrow", "requests", "openpyxl", "xlrd", "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assetpred = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet", "slow: takes more than a few seconds", "realdata: needs data/processed"]
