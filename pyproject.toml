[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lam"
version = "0.1.0"
description = "Leveraged multi-asset allocation under a hard S&P 500 drawdown constraint"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1", "xlrd>=2"]

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard page shell is a data file inside the package, so it has to be
# declared here or a non-editable install ships lam.report.dashboard without the
# template it reads -- working in the repo and failing everywhere else.
[tool.setuptools.package-data]
"lam.report" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["network: requires live network access"]
